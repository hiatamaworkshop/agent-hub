name: CI

# Typecheck, unit tests, docs:check, coverage, and ui:check (which needs Chrome; both runners have it, C174).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      # Line endings need no setting here: .gitattributes (`* text=auto eol=lf`) fixes them at checkout.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      # A measurement, not a gate (C173): prints line and branch coverage per file, and writes the table to the job summary.
      # No threshold fails the build; the step fails only if a test fails in its run.
      - run: npm run test:coverage
      # The page against a real Hub, scene by scene (C174). Chrome is on both hosted runners; its sandbox does not start on
      # the Linux one (no user namespaces for it), so only there --no-sandbox is added. A scene that fails only on a runner
      # is a finding to record in the item, not a scene to skip.
      - run: npm run ui:check
        env:
          UI_CHECK_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '0' }}
