name: CI

# Runs the checks that do not need Chrome (ui:check is not here; C151).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      # Keep line endings as stored in the repository (LF, see .gitattributes).
      # On the Windows runner git would otherwise convert them to CRLF at checkout.
      - name: Turn off CRLF conversion before checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
