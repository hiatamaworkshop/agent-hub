# Resident Hub (design.md §3.8). The shim and hooks run on the host and use HUB_TOKEN from the same .env
services:
  hub:
    build: .
    image: agent-hub
    restart: unless-stopped
    init: true
    env_file: .env
    # HUB_HOST / HUB_DATA_DIR / HUB_ROLES_FILE / HUB_CONFIG_FILE in .env are for a direct start, so they are overridden with the values inside the container
    environment:
      HUB_HOST: 0.0.0.0
      # The container listens on the same port, so the UI URL in the log can be opened from the host
      HUB_PORT: ${HUB_PORT:-7777}
      HUB_DATA_DIR: /data
      HUB_ROLES_FILE: /host/roles.json
      HUB_CONFIG_FILE: /host/hub.config.json
    ports:
      # Removing 127.0.0.1: publishes on every interface. Do not remove it
      - "127.0.0.1:${HUB_PORT:-7777}:${HUB_PORT:-7777}"
    volumes:
      - hub-data:/data
      # The repository root, including roles.json, is shown read-only. Bind-mounting a single file (configs too) would make
      # Docker Desktop create an empty directory on the host when the file is missing, which would break even a direct start.
      # Without the file it runs without roles, as a direct start does
      - ./:/host:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.HUB_PORT+'/mailboxes',{headers:{authorization:'Bearer '+process.env.HUB_TOKEN}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  hub-data:
